name: Publish to PyPI and GitHub Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.1

permissions:
  contents: write  # For creating GitHub releases
  id-token: write  # For PyPI trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses GitHub's Trusted Publisher (OIDC) - no API token needed!
          # You must configure this on PyPI first (see instructions below)
          verbose: true
      
      - name: Extract release notes
        id: extract_notes
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${TAG_NAME#v}" >> $GITHUB_OUTPUT
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.extract_notes.outputs.tag_name }}
          body: |
            ## 📦 PyPI Package
            Install via pip:
            ```bash
            pip install repo2notebook==${{ steps.extract_notes.outputs.version }}
            ```
            
            [View on PyPI](https://pypi.org/project/repo2notebook/${{ steps.extract_notes.outputs.version }}/)
          files: |
            dist/*
          draft: false
          prerelease: false
